version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: studentlife-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: studentlife_tracker
    volumes:
      - mongo_data:/data/db
    networks:
      - studentlife-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studentlife-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/studentlife_tracker
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_at_least_32_chars_long!}
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:3000
      BCRYPT_ROUNDS: 12
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-BF2Y4k...}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-...}
      VAPID_SUBJECT: mailto:admin@studentlifetracker.com
      SMTP_HOST: ${SMTP_HOST:-smtp.mailtrap.io}
      SMTP_PORT: ${SMTP_PORT:-2525}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: noreply@studentlifetracker.com
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - studentlife-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    container_name: studentlife-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
    depends_on:
      - backend
    networks:
      - studentlife-network

networks:
  studentlife-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
